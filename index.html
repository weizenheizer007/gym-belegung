<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gym</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f5;
  --card: #ffffff;
  --surface: #ececef;
  --line: rgba(0,0,0,.07);
  --text-primary: #111214;
  --text-secondary: #55585f;
  --text-muted: #8b8e95;
  --grid: rgba(0,0,0,.06);
  --accent: #2563eb;
  --accent-soft: rgba(37,99,235,.12);
  --series-1: #9aa3b2;
  --series-2: #2563eb;
  --closed: #e6e6ea;
  --amp-1: #16a34a; --amp-2: #84cc16; --amp-3: #eab308; --amp-4: #f97316; --amp-5: #ef4444;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0e0f11;
    --card: #17181b;
    --surface: #212226;
    --line: rgba(255,255,255,.06);
    --text-primary: #f2f2f3;
    --text-secondary: #a6a8ae;
    --text-muted: #6f727a;
    --grid: rgba(255,255,255,.06);
    --accent: #5b8cff;
    --accent-soft: rgba(91,140,255,.16);
    --series-1: #5c6170;
    --series-2: #5b8cff;
    --closed: #1f2024;
    --amp-1: #22c55e; --amp-2: #a3e635; --amp-3: #facc15; --amp-4: #fb923c; --amp-5: #f87171;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text-primary); min-height: 100%; }
body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
       -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
       padding: max(20px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
main { max-width: 980px; margin: 0 auto; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
main > *, .status > * { min-width: 0; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 20px; }
h2 { font-size: 13px; font-weight: 600; color: var(--text-muted); margin: 0; letter-spacing: .01em; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

/* Status */
.status { display: grid; grid-template-columns: 1.15fr 1fr; gap: 12px; }
@media (max-width: 680px) { .status { grid-template-columns: 1fr; } }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 9px; border-radius: 999px;
        background: var(--surface); font-weight: 600; font-size: 13px; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--closed); flex: none; }
.big { font-size: 76px; font-weight: 700; letter-spacing: -.045em; line-height: .95; margin: 18px 0 6px; font-variant-numeric: tabular-nums; }
.big small { font-size: 17px; font-weight: 500; color: var(--text-secondary); letter-spacing: 0; margin-left: 8px; }
.meta { color: var(--text-muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 999px; background: var(--surface); margin: 18px 0 0; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; border-radius: 999px; transition: width .5s cubic-bezier(.2,.8,.2,1), background .3s; }
.meter-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-top: 7px; font-variant-numeric: tabular-nums; min-height: 1em; }
.log { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 18px; }
.log a { display: flex; align-items: center; justify-content: center; gap: 7px; height: 40px; border-radius: 12px; background: var(--surface);
         color: var(--text-primary); text-decoration: none; font-size: 14px; font-weight: 500; transition: transform .1s, background .2s; }
.log a:active { transform: scale(.96); }
.log a i { width: 8px; height: 8px; border-radius: 50%; }
#logTxt { margin-top: 8px; font-size: 12px; }

.reco { display: flex; gap: 14px; align-items: flex-start; margin-top: 16px; }
.reco .ico { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.reco .ico svg { width: 20px; height: 20px; }
.reco b { font-size: 19px; font-weight: 650; display: block; letter-spacing: -.01em; line-height: 1.25; }
.reco .sub { color: var(--text-secondary); font-size: 14px; display: block; margin-top: 4px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
.fact { background: var(--surface); border-radius: 14px; padding: 11px 13px; }
.fact .l { font-size: 12px; color: var(--text-muted); }
.fact .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }

/* Controls */
.head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface); border-radius: 11px; }
.seg button { background: none; border: 0; padding: 6px 11px; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 500; color: var(--text-secondary); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--text-primary); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.tabs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 3px; background: var(--surface); border-radius: 11px; }
.tabs button { background: none; border: 0; padding: 7px 0; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 500; color: var(--text-secondary); cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--card); color: var(--text-primary); box-shadow: 0 1px 3px rgba(0,0,0,.15); }

.scroll { overflow: hidden; }
svg { display: block; }
svg text { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; font-family: inherit; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); margin: 12px 0 0; align-items: center; }
.legend .scale { display: inline-flex; gap: 3px; }
.legend .sq { width: 14px; height: 10px; border-radius: 3px; display: inline-block; }
.sw { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
#tip { position: fixed; pointer-events: none; background: var(--card); color: var(--text-primary); border: 1px solid var(--line); border-radius: 12px; padding: 8px 11px;
       font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.25); display: none; z-index: 9; white-space: nowrap; }
#tip b { font-variant-numeric: tabular-nums; }
.quiet { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.quiet div { padding: 7px 12px; border-radius: 10px; font-size: 13px; background: var(--surface); display: inline-flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; }
.quiet i { width: 8px; height: 8px; border-radius: 50%; }
footer { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--text-muted); padding: 6px 4px 0; }
footer a { color: inherit; text-decoration: none; }
</style>
</head>
<body>
<main>
  <section class="status">
    <div class="card">
      <div class="row"><h2>Jetzt</h2><span class="pill"><span class="dot" id="dot"></span><span id="lvl">–</span></span></div>
      <div class="big" id="nowNum">–</div>
      <div class="meta" id="nowMeta"></div>
      <div class="meter"><i id="bar"></i></div>
      <div class="meter-row"><span id="barTxt"></span><span id="peakTxt"></span></div>
      <div class="log" id="logBtns"></div>
      <div class="meta" id="logTxt"></div>
    </div>
    <div class="card">
      <h2>Prognose</h2>
      <div class="reco">
        <div class="ico" id="recoIco"></div>
        <div><b id="recoTitle">–</b><span class="sub" id="recoText"></span></div>
      </div>
      <div class="facts">
        <div class="fact"><div class="l">Üblich jetzt</div><div class="v" id="typNow">–</div></div>
        <div class="fact"><div class="l" id="nextL">In 1 Std.</div><div class="v" id="typNext">–</div></div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="head"><h2>Woche</h2><div class="seg" id="range"></div></div>
    <div class="scroll"><svg id="heat" role="img" aria-label="Wochenübersicht"></svg></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="card">
    <div class="head"><h2>Tag</h2>
      <div class="legend" style="margin:0">
        <span><i class="sw" style="background:var(--series-1)"></i>Ø</span>
        <span><i class="sw" style="background:var(--series-2)"></i><span id="thisLbl">diese Woche</span></span>
      </div>
    </div>
    <div class="tabs" id="days"></div>
    <div class="scroll" style="margin-top:14px"><svg id="line" role="img" aria-label="Tagesverlauf"></svg></div>
    <div class="quiet" id="quiet"></div>
  </section>

  <footer>
    <a href="https://www.hochschulsport.uni-mannheim.de/angebote/aktueller_zeitraum_0/_T1_FitnessGym_Studiobelegung.html">Hochschulsport Mannheim</a>
    <span><a id="rawLink" href="#">CSV</a> · <span id="upd"></span></span>
  </footer>
</main>
<div id="tip"></div>
<script>
const DAYS = ["Mo","Di","Mi","Do","Fr","Sa","So"];
const DAYS_LONG = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const tip = document.getElementById("tip");
const $ = id => document.getElementById(id);
const pad2 = n => String(n).padStart(2, "0");
const slotLbl = s => `${pad2(Math.floor((s % 96) / 4))}:${pad2((s % 4) * 15)}`;
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const nowSlot = () => { const d = new Date(); return { wd: (d.getDay() + 6) % 7, s: Math.round((d.getHours() * 60 + d.getMinutes()) / 15) % 96 }; };

function showTip(ev, html) { tip.innerHTML = html; tip.style.display = "block";
  const w = tip.offsetWidth, x = ev.clientX + 14 + w > innerWidth ? ev.clientX - w - 14 : ev.clientX + 14;
  tip.style.left = x + "px"; tip.style.top = (ev.clientY + 16) + "px"; }
function hideTip() { tip.style.display = "none"; }

// ---------- Ampel ----------
// Stufen relativ zur üblichen Spitze (höchster Durchschnittswert der Woche)
const STEPS = [ // [bis Anteil der Spitze, Farbe, Name]
  [0.20, "--amp-1", "sehr ruhig"], [0.40, "--amp-2", "ruhig"], [0.55, "--amp-3", "mittel"],
  [0.70, "--amp-4", "gut besucht"], [Infinity, "--amp-5", "voll"]];
// Logbuch-Kalibrierung: eigene Einschätzungen (leer / ok / voll) mit der gemessenen Personenzahl.
// b1 = bis hierhin kein Warten, b2 = ab hier voll. sure1 = obere Grenze von b1 ist durch ok/voll-Einträge belegt.
let LOG = [], CAL = {};
function calibrate() {
  const by = g => LOG.filter(e => e.g === g).map(e => e.n).sort((a, b) => a - b);
  const med = a => a.length ? (a.length % 2 ? a[a.length >> 1] : (a[a.length / 2 - 1] + a[a.length / 2]) / 2) : null;
  const L = by("leer"), O = by("ok"), V = by("voll"), mL = med(L), mO = med(O), mV = med(V);
  const up = mO ?? mV;
  let b1 = null, b2 = null, sure1 = false;
  // nur leer + voll bekannt: Abstand dritteln (unteres Drittel kein Warten, oberes voll)
  const third = mO == null && mL != null && mV != null && mV > mL;
  if (L.length) { b1 = third ? mL + (mV - mL) / 3 : up != null && up > mL ? (mL + up) / 2 : L[L.length - 1]; sure1 = up != null && up > mL; }
  if (V.length) { const lo = mO ?? mL; b2 = third ? mL + 2 * (mV - mL) / 3 : lo != null && lo < mV ? (lo + mV) / 2 : mV * 0.9; }
  if (b1 != null && b2 != null && b2 <= b1) b2 = null;
  CAL = { b1, b2, sure1, n: LOG.length };
}
function step(v, peak) {
  let i = STEPS.findIndex(([t]) => v / peak < t);
  if (CAL.b1 != null) { if (v <= CAL.b1) i = Math.min(i, 1); else if (CAL.sure1) i = Math.max(i, 2); }
  if (CAL.b2 != null && v >= CAL.b2) i = 4;
  return STEPS[i];
}
// ohne genug Messtage: nur Logbuch -> grobe Einstufung oder null
function calStep(v) {
  if (CAL.b1 != null && v <= CAL.b1) return STEPS[1];
  if (CAL.b2 != null && v >= CAL.b2) return STEPS[4];
  if (CAL.sure1 && v > CAL.b1) return STEPS[2];
  return null;
}
function parseLog(text) {
  return (text || "").trim().split(/\r?\n/).slice(1).map(l => {
    const [t, g, n] = l.split(",");
    return { t, g, n: n === "" || n == null ? NaN : +n };
  }).filter(e => e.g && !isNaN(e.n));
}
function drawLog() {
  const pad = x => String(x).padStart(2, "0"), d = new Date();
  const zeit = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  $("logBtns").innerHTML = [["leer", "Leer", "--amp-1"], ["ok", "Okay", "--amp-3"], ["voll", "Voll", "--amp-5"]].map(([g, l, c]) =>
    `<a target="_blank" rel="noopener" aria-label="Logbuch: ${l}" href="https://github.com/${OWNER}/${REPO}/issues/new?title=${encodeURIComponent("Logbuch: " + g)}&body=${encodeURIComponent("Zeit: " + zeit + "\n\n")}"><i style="background:var(${c})"></i>${l}</a>`).join("");
  const parts = [];
  if (CAL.b1 != null) parts.push(`≤ ${Math.round(CAL.b1)} frei`);
  if (CAL.b2 != null) parts.push(`≥ ${Math.round(CAL.b2)} voll`);
  $("logTxt").textContent = parts.length ? `Logbuch: ${parts.join(" · ")} · ${CAL.n}×` : "";
}
const LEVEL = { "sehr ruhig": "Ruhig", "ruhig": "Ruhig", "mittel": "Mittel", "gut besucht": "Gut besucht", "voll": "Voll" };

// ---------- Daten ----------
function parseCSV(text) {
  return text.trim().split(/\r?\n/).slice(1).map(l => {
    const [t, p] = l.split(",");
    const m = t.match(/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/);
    if (!m) return null;
    const date = new Date(+m[1], +m[2] - 1, +m[3]);
    return { t, date, key: `${m[1]}-${m[2]}-${m[3]}`, wd: (date.getDay() + 6) % 7,
             slot: Math.round((+m[4] * 60 + +m[5]) / 15) % 96, min: +m[4] * 60 + +m[5], hhmm: `${m[4]}:${m[5]}`, n: +p };
  }).filter(r => r && !isNaN(r.n));
}

let ALL = [], LIVE = null, RANGE = "all", DAY = nowSlot().wd;

function filtered() {
  if (RANGE === "all") return ALL;
  const cut = new Date(); cut.setDate(cut.getDate() - (RANGE === "4w" ? 28 : 14)); cut.setHours(0, 0, 0, 0);
  return ALL.filter(r => r.date >= cut);
}
function averages(rows) {
  const sum = Array.from({ length: 7 }, () => new Float64Array(96)), cnt = Array.from({ length: 7 }, () => new Uint32Array(96));
  for (const r of rows) { sum[r.wd][r.slot] += r.n; cnt[r.wd][r.slot]++; }
  return sum.map((s, wd) => Array.from(s, (v, i) => cnt[wd][i] ? v / cnt[wd][i] : null));
}
function slotRange(avg) {
  let lo = 96, hi = -1;
  avg.forEach(day => day.forEach((v, i) => { if (v) { lo = Math.min(lo, i); hi = Math.max(hi, i); } }));
  // mindestens 06:00–23:00 zeigen, bei Daten außerhalb entsprechend mehr
  lo = Math.min(24, hi < 0 ? 24 : Math.floor(lo / 4) * 4 - 4); hi = Math.max(91, hi < 0 ? 91 : Math.ceil((hi + 1) / 4) * 4 + 3);
  return [Math.max(0, lo), Math.min(95, hi)];
}
const isOpen = v => v != null && v >= 0.5;
const peakOf = avg => Math.max(1, ...avg.flat().filter(v => v != null));
// Wert in "absoluten" Slots ab Wochenbeginn (über Tagesgrenzen hinweg)
const at = (avg, abs) => avg[Math.floor(abs / 96) % 7][abs % 96];

// ---------- Status + Empfehlung ----------
const ICON = {
  ok: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  wait: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  moon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/></svg>',
};
const fmtWait = m => m < 60 ? `${m} Min.` : `${Math.floor(m / 60)} Std.${m % 60 ? " " + (m % 60) + " Min." : ""}`;

const MIN_DAYS = 3; // ab so vielen Messtagen gibt es Ampel und Empfehlung

function drawStatus(avg) {
  const peak = peakOf(avg), { wd, s } = nowSlot(), nowAbs = wd * 96 + s;
  const nDays = new Set(ALL.map(r => r.key)).size, enough = nDays >= MIN_DAYS;
  const last = LIVE || ALL[ALL.length - 1];
  const ageMin = last ? Math.max(0, Math.round((new Date() - new Date(last.t)) / 60000)) : Infinity;
  const fresh = ageMin <= 30;
  const typ = avg[wd][s];
  const open = fresh ? (last.n > 0 || isOpen(typ)) : isOpen(typ);
  const val = fresh ? last.n : typ;
  const ago = m => m < 1 ? "gerade eben" : m < 60 ? `vor ${m} Min.` : m < 1440 ? `vor ${Math.round(m / 60)} Std.` : `vor ${Math.round(m / 1440)} Tagen`;
  const neutral = txt => { $("lvl").textContent = txt; $("dot").style.background = css("--closed"); $("bar").style.width = "0"; };

  if (!last) {
    neutral("Keine Daten"); $("nowNum").innerHTML = "–";
    $("nowMeta").textContent = "Noch keine Messung";
  } else if (fresh) {
    $("nowNum").innerHTML = `${last.n}<small>Personen</small>`;
    $("nowMeta").textContent = `${last.hhmm} Uhr · ${ago(ageMin)}`;
    if (!open) neutral("Geschlossen");
    else if (!enough) { const c = calStep(val);
      if (c) { $("lvl").textContent = LEVEL[c[2]]; $("dot").style.background = css(c[1]); } else neutral("Offen"); }
    else { const st = step(val, peak); $("lvl").textContent = LEVEL[st[2]]; $("dot").style.background = css(st[1]);
           $("bar").style.width = Math.min(100, val / peak * 100) + "%"; $("bar").style.background = css(st[1]); }
  } else {
    $("nowNum").innerHTML = enough && isOpen(typ) ? `${Math.round(typ)}<small>üblich</small>` : `${last.n}<small>Personen</small>`;
    $("nowMeta").textContent = `Letzte Messung ${ago(ageMin)}`;
    if (enough && isOpen(typ)) { const st = step(typ, peak); $("lvl").textContent = LEVEL[st[2]] + " (üblich)"; $("dot").style.background = css(st[1]);
           $("bar").style.width = Math.min(100, typ / peak * 100) + "%"; $("bar").style.background = css(st[1]); }
    else neutral(enough ? "Vermutlich zu" : "Veraltet");
  }
  const showBar = enough && open && val != null;
  $("barTxt").textContent = showBar ? `${Math.round(val / peak * 100)} %` : (enough ? "" : `Messtag ${nDays}/${MIN_DAYS}`);
  $("peakTxt").textContent = enough ? `Spitze ${Math.round(peak)}` : "";

  const setReco = (ico, t, x) => { $("recoIco").innerHTML = ICON[ico]; $("recoTitle").textContent = t; $("recoText").textContent = x; };
  if (!enough) {
    setReco("wait", "Noch zu wenig Daten", `Messtag ${nDays} von ${MIN_DAYS}`);
    $("typNow").textContent = "–"; $("typNext").textContent = "–"; $("nextL").textContent = "In 1 Stunde";
    return;
  }
  // Empfehlung: die nächsten Stunden durchsuchen
  const future = [];
  for (let k = 1; k <= 96 * 7; k++) future.push([k, at(avg, nowAbs + k)]);
  const when = k => { const d = new Date(); d.setHours(0, (s + k) * 15, 0, 0);
                      const day = (d.getDay() + 6) % 7;
                      return (day === wd && k < 96 ? "" : day === (wd + 1) % 7 && k < 192 ? "morgen " : DAYS_LONG[day] + " ") + `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
  const hasData = d => avg[d].some(isOpen);

  if (!open) {
    const nx = future.find(([, v]) => isOpen(v));
    // Tage ohne jede Messung (z. B. erstes Wochenende) -> Öffnungszeit unbekannt statt falscher Prognose
    const gap = nx && Array.from({ length: Math.floor((s + nx[0]) / 96) + 1 }, (_, i) => (wd + i) % 7).find(d => !hasData(d));
    if (gap != null && gap !== undefined) setReco("moon", "Geschlossen", `Für ${DAYS_LONG[gap]} noch keine Daten.`);
    else if (nx) {
      const first = future.slice(nx[0] - 1, nx[0] + 3).filter(([, v]) => isOpen(v)), q = first.reduce((x, f) => x + f[1], 0) / first.length;
      setReco("moon", `Öffnet ${when(nx[0])}`, `Erste Stunde Ø ${Math.round(q)} · ${LEVEL[step(q, peak)[2]].toLowerCase()}`);
    } else setReco("moon", "Geschlossen", "Öffnungszeit noch unbekannt.");
  } else {
    // nächste 4 Std., nur solange geöffnet
    const today = [];
    for (const f of future) { if (f[0] > 16 || !isOpen(f[1])) break; today.push(f); }
    let lvlNow = val / peak;
    if (CAL.b1 != null && val <= CAL.b1) lvlNow = Math.min(lvlNow, 0.39);       // laut Logbuch kein Warten
    else if (CAL.sure1 && val > CAL.b1) lvlNow = Math.max(lvlNow, 0.4);
    if (CAL.b2 != null && val >= CAL.b2) lvlNow = Math.max(lvlNow, 0.7);        // laut Logbuch voll
    const closes = today.length < 16 ? ` Schließt ~${when(today.length + 1)}.` : "";
    const rush = today.find(([k, v]) => k <= 4 && v / peak >= 0.7 && v > val * 1.25); // in <1 Std. deutlich voller
    if (lvlNow < 0.4) {
      const busy = today.find(([, v]) => v / peak >= 0.55);
      setReco("ok", "Jetzt gehen",
        (busy ? `Ab ~${when(busy[0])} voller.` + closes : `Bleibt ruhig.${closes}`));
    } else if (rush && lvlNow < 0.7) {
      const after = today.find(([k, v]) => k > rush[0] && v <= val);
      setReco("ok", "Besser jetzt",
        `Ab ~${when(rush[0])} voll` + (after ? `, erst ab ~${when(after[0])} wieder so leer.` : ".") + closes);
    } else {
      // spürbar ruhiger = Ampel "ruhig" oder mindestens 25 % weniger als jetzt
      const calm = today.find(([, v]) => v / peak < 0.4) || today.find(([, v]) => v <= val * 0.75);
      if (calm) {
        const mins = calm[0] * 15;
        setReco("wait", mins <= 30 ? "Kurz warten" : `${fmtWait(mins)} warten`,
          `Ab ~${when(calm[0])} ruhiger: Ø ${Math.round(calm[1])} statt ${Math.round(val)}.`);
      } else {
        const better = today.slice().sort((a, b) => a[1] - b[1])[0];
        setReco("wait", lvlNow >= 0.7 ? "Bleibt voll" : "Wird nicht deutlich ruhiger",
          better && better[1] < val * 0.85 ? `Am ehesten ~${when(better[0])} (Ø ${Math.round(better[1])}).` : "Heute nicht mehr ruhiger.");
      }
    }
  }
  $("typNow").textContent = isOpen(typ) ? `Ø ${Math.round(typ)}` : "zu";
  const t1 = at(avg, nowAbs + 4);
  $("nextL").textContent = `${when(4)} Uhr`;
  $("typNext").textContent = isOpen(t1) ? `Ø ${Math.round(t1)}` : "zu";
}

// ---------- Heatmap ----------
// leicht glätten (gewichteter Durchschnitt mit den Nachbar-Viertelstunden), Lücken bleiben Lücken
const smooth = arr => arr.map((v, i) => {
  if (v == null) return null;
  let s = v * 2, w = 2;
  for (const j of [i - 1, i + 1]) if (arr[j] != null) { s += arr[j]; w++; }
  return s / w;
});
// Weiche Kurve durch Punkte ohne Überschwinger (monotone kubische Interpolation)
function curve(pts) {
  if (pts.length < 2) return "";
  const n = pts.length, dx = [], m = [], t = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; m[i] = (pts[i + 1][1] - pts[i][1]) / dx[i]; }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : 3 * (dx[i - 1] + dx[i]) / ((2 * dx[i] + dx[i - 1]) / m[i - 1] + (dx[i] + 2 * dx[i - 1]) / m[i]);
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++) {
    const h = dx[i] / 3;
    d += `C${(pts[i][0] + h).toFixed(1)},${(pts[i][1] + t[i] * h).toFixed(1)} ${(pts[i + 1][0] - h).toFixed(1)},${(pts[i + 1][1] - t[i + 1] * h).toFixed(1)} ${pts[i + 1][0].toFixed(1)},${pts[i + 1][1].toFixed(1)}`;
  }
  return d;
}
// zusammenhängende Abschnitte (Lücke > maxGap trennt)
function runs(pts, maxGap) {
  const out = []; let cur = [];
  for (const p of pts) { if (cur.length && p[0] - cur[cur.length - 1][0] > maxGap) { out.push(cur); cur = []; } cur.push(p); }
  if (cur.length) out.push(cur);
  return out;
}

function drawHeat(avg, [lo, hi]) {
  const svg = $("heat"); svg.innerHTML = "";
  const peak = peakOf(avg), enough = new Set(ALL.map(r => r.key)).size >= MIN_DAYS;
  $("legend").innerHTML = enough
    ? `<span>ruhig</span><span class="scale">${STEPS.map(st => `<i class="sq" style="background:var(${st[1]})"></i>`).join("")}</span><span>voll</span>`
    : "";
  // eine Kachel pro Stunde: Durchschnitt der 4 Viertelstunden
  const h0 = Math.floor(lo / 4), h1 = Math.floor(hi / 4), nh = h1 - h0 + 1;
  const hourly = avg.map(day => Array.from({ length: nh }, (_, i) => {
    const v = day.slice((h0 + i) * 4, (h0 + i) * 4 + 4).filter(x => x != null);
    return v.length ? v.reduce((x, y) => x + y, 0) / v.length : null; }));
  const maxV = Math.max(1, ...hourly.flat().filter(v => v != null));
  const W = svg.parentElement.clientWidth || 900, narrow = W < 600;
  const L = 26, B = 20, gap = narrow ? 2 : 3, cw = (W - L - gap * (nh - 1)) / nh, chh = narrow ? 22 : 26, H = 7 * (chh + gap) + B;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.style.width = "100%"; svg.style.height = "auto";
  const ns = nowSlot(), nowH = Math.floor(ns.s / 4) - h0;
  for (let wd = 0; wd < 7; wd++) {
    const y = wd * (chh + gap);
    const lbl = el("text", { x: 0, y: y + chh / 2 + 4, "font-size": 12 }, svg); lbl.textContent = DAYS[wd];
    if (wd === ns.wd) { lbl.style.fill = css("--text-primary"); lbl.style.fontWeight = 600; }
    for (let i = 0; i < nh; i++) {
      const v = hourly[wd][i], open = isOpen(v), x = L + i * (cw + gap);
      const fill = !open ? css("--closed") : enough ? css(step(v, peak)[1]) : css("--series-2");
      const r = el("rect", { x, y, width: cw, height: chh, rx: Math.min(6, cw / 3), fill, style: "cursor:pointer" }, svg);
      if (open && !enough) r.setAttribute("fill-opacity", (0.25 + 0.75 * v / maxV).toFixed(2));
      if (wd === ns.wd && i === nowH) { r.setAttribute("stroke", css("--text-primary")); r.setAttribute("stroke-width", 2); }
      const hh = h0 + i;
      r.addEventListener("mousemove", ev => showTip(ev, `<b>${DAYS[wd]} ${pad2(hh)}–${pad2(hh + 1)} Uhr</b><br>` +
        (v == null ? "keine Daten" : open ? `Ø <b>${Math.round(v)}</b>` + (enough ? ` · ${LEVEL[step(v, peak)[2]]}` : "") : "geschlossen")));
      r.addEventListener("mouseleave", hideTip);
      r.addEventListener("click", () => { DAY = wd; render(); $("days").scrollIntoView({ behavior: "smooth", block: "center" }); });
    }
  }
  const every = narrow ? 3 : 2;
  for (let i = 0; i < nh; i++) if ((h0 + i) % every === 0)
    el("text", { x: L + i * (cw + gap) + cw / 2, y: H - 4, "text-anchor": "middle" }, svg).textContent = h0 + i;
}

// ---------- Tagesverlauf ----------
function weekStart(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }

function drawLine(avg, [lo, hi]) {
  const svg = $("line"); svg.innerHTML = "";
  const ws = weekStart(new Date()), target = new Date(ws); target.setDate(ws.getDate() + DAY);
  const tkey = `${target.getFullYear()}-${pad2(target.getMonth() + 1)}-${pad2(target.getDate())}`;
  $("thisLbl").textContent = `${target.getDate()}.${target.getMonth() + 1}.`;
  // diese Woche: jede einzelne Messung mit exakter Uhrzeit (Minuten)
  const cur = ALL.filter(r => r.key === tkey).map(r => [r.min, r.n]).sort((p, q) => p[0] - q[0]);
  const a = avg[DAY], sm = smooth(a);
  const W = Math.max(320, svg.parentElement.clientWidth || 1000), H = W < 600 ? 220 : 270, L = 30, R = 8, T = 14, B = 26;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.style.width = "100%"; svg.style.height = "auto";
  const m0 = lo * 15, m1 = hi * 15;
  const vals = [...a.slice(lo, hi + 1), ...cur.map(p => p[1])].filter(v => v != null);
  const ymax = Math.max(10, Math.ceil(Math.max(...vals, 0) / 10) * 10);
  const X = m => L + (m - m0) / (m1 - m0) * (W - L - R), Y = v => T + (1 - v / ymax) * (H - T - B);
  for (let g = 0; g <= ymax; g += ymax > 40 ? 20 : 10) {
    el("line", { x1: L, x2: W - R, y1: Y(g), y2: Y(g), stroke: css("--grid"), "stroke-width": 1 }, svg);
    el("text", { x: L - 8, y: Y(g) + 4, "text-anchor": "end" }, svg).textContent = g;
  }
  for (let s = lo; s <= hi; s++) if (s % (W < 600 ? 16 : 8) === 0) el("text", { x: X(s * 15), y: H - 6, "text-anchor": "middle" }, svg).textContent = slotLbl(s);
  const defs = el("defs", {}, svg);
  const fade = (id, color, top) => { const g = el("linearGradient", { id, x1: 0, x2: 0, y1: 0, y2: 1 }, defs);
    el("stop", { offset: 0, "stop-color": color, "stop-opacity": top }, g); el("stop", { offset: 1, "stop-color": color, "stop-opacity": 0 }, g); };
  fade("fa", css("--series-1"), 0.28);
  const draw = (pts, color, fillId, gap) => {
    for (const run of runs(pts, gap)) {
      const xy = run.map(([m, v]) => [X(m), Y(v)]);
      if (xy.length === 1) { el("circle", { cx: xy[0][0], cy: xy[0][1], r: 4, fill: color, stroke: css("--card"), "stroke-width": 2 }, svg); continue; }
      const d = curve(xy);
      if (fillId) el("path", { d: `${d}L${xy[xy.length - 1][0].toFixed(1)},${Y(0)}L${xy[0][0].toFixed(1)},${Y(0)}Z`, fill: `url(#${fillId})` }, svg);
      el("path", { d, fill: "none", stroke: color, "stroke-width": 2.5, "stroke-linecap": "round", "stroke-linejoin": "round" }, svg);
    }
  };
  const avgPts = []; for (let s = lo; s <= hi; s++) if (sm[s] != null) avgPts.push([s * 15, sm[s]]);
  draw(avgPts, css("--series-1"), "fa", 30);
  // Einzelmessungen schwanken; für die Linie über ±10 Min. mitteln (Tooltip zeigt die echten Werte)
  const curSm = cur.map(([m]) => { const w = cur.filter(q => Math.abs(q[0] - m) <= 10); return [m, w.reduce((x, q) => x + q[1], 0) / w.length]; });
  draw(curSm, css("--series-2"), null, 30);
  const ns = nowSlot();
  if (DAY === ns.wd && ns.s >= lo && ns.s <= hi) {
    const nm = new Date().getHours() * 60 + new Date().getMinutes();
    el("line", { x1: X(nm), x2: X(nm), y1: T, y2: H - B, stroke: css("--accent"), "stroke-width": 1, "stroke-dasharray": "3 4" }, svg);
    el("text", { x: X(nm) + 5, y: T + 8, style: `fill:${css("--accent")}` }, svg).textContent = "jetzt";
  }
  const cross = el("line", { y1: T, y2: H - B, stroke: css("--text-muted"), "stroke-width": 1, visibility: "hidden" }, svg);
  const d1 = el("circle", { r: 5, fill: css("--series-1"), stroke: css("--card"), "stroke-width": 2, visibility: "hidden" }, svg);
  const d2 = el("circle", { r: 5, fill: css("--series-2"), stroke: css("--card"), "stroke-width": 2, visibility: "hidden" }, svg);
  const hit = el("rect", { x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent" }, svg);
  hit.addEventListener("mousemove", ev => {
    const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY;
    const m = m0 + (p.matrixTransform(svg.getScreenCTM().inverse()).x - L) / (W - L - R) * (m1 - m0);
    const s = Math.max(lo, Math.min(hi, Math.round(m / 15)));
    const c = cur.reduce((best, q) => Math.abs(q[0] - m) < 8 && (!best || Math.abs(q[0] - m) < Math.abs(best[0] - m)) ? q : best, null);
    cross.setAttribute("x1", X(m)); cross.setAttribute("x2", X(m)); cross.setAttribute("visibility", "visible");
    if (sm[s] == null) d1.setAttribute("visibility", "hidden");
    else { d1.setAttribute("cx", X(s * 15)); d1.setAttribute("cy", Y(sm[s])); d1.setAttribute("visibility", "visible"); }
    if (!c) d2.setAttribute("visibility", "hidden");
    else { const cs = curSm.find(q => q[0] === c[0]); d2.setAttribute("cx", X(c[0])); d2.setAttribute("cy", Y(cs ? cs[1] : c[1])); d2.setAttribute("visibility", "visible"); }
    const hm = q => `${pad2(Math.floor(q / 60))}:${pad2(q % 60)}`;
    showTip(ev, `<b>${slotLbl(s)}</b><br><i class="sw" style="background:${css("--series-1")}"></i>Ø ${a[s] == null ? "–" : `<b>${a[s].toFixed(1)}</b>`}` +
      `<br><i class="sw" style="background:${css("--series-2")}"></i>${c ? `${hm(c[0])} Uhr: <b>${c[1]}</b>` : "diese Woche –"}`);
  });
  hit.addEventListener("mouseleave", () => { hideTip(); [cross, d1, d2].forEach(e => e.setAttribute("visibility", "hidden")); });

  const peak = peakOf(avg), cand = [];
  for (let s = lo; s + 3 <= hi; s++) {
    const win = a.slice(s, s + 4);
    if (win.some(v => !isOpen(v))) continue;
    cand.push([s, win.reduce((x, y) => x + y, 0) / 4]);
  }
  cand.sort((x, y) => x[1] - y[1]);
  const pick = [];
  for (const c of cand) { if (pick.every(p => Math.abs(p[0] - c[0]) >= 6)) pick.push(c); if (pick.length === 3) break; }
  $("quiet").innerHTML = pick.length ? pick.sort((x, y) => x[0] - y[0]).map(([s, v]) =>
    `<div><i style="background:var(${step(v, peak)[1]})"></i>${slotLbl(s)}–${slotLbl(s + 4)} · Ø ${v.toFixed(0)}</div>`).join("")
    : "";
}

function controls() {
  $("range").innerHTML = [["all", "Alle"], ["4w", "4 W"], ["2w", "2 W"]]
    .map(([k, l]) => `<button aria-pressed="${RANGE === k}" data-k="${k}">${l}</button>`).join("");
  $("range").querySelectorAll("button").forEach(b => b.onclick = () => { RANGE = b.dataset.k; render(); });
  $("days").innerHTML = DAYS_LONG.map((d, i) => `<button aria-pressed="${DAY === i}" data-i="${i}">${DAYS[i]}</button>`).join("");
  $("days").querySelectorAll("button").forEach(b => b.onclick = () => { DAY = +b.dataset.i; render(); });
}

function render() {
  controls();
  const avg = averages(filtered()), rng = slotRange(averages(ALL));
  drawLog(); drawStatus(avg); drawHeat(avg, rng); drawLine(avg, rng);
}

// Daten liegen im data-Branch des Repos; so muss die Seite nicht bei jeder Messung neu gebaut werden.
// Account- und Repo-Name kommen aus der Adresse: https://ACCOUNT.github.io/REPO/
const OWNER = location.hostname.split(".")[0];
const REPO = location.pathname.split("/")[1] || "gym-belegung";
document.getElementById("rawLink").href = `https://github.com/${OWNER}/${REPO}/blob/data/data/belegung.csv`;
const RAW = f => `https://raw.githubusercontent.com/${OWNER}/${REPO}/data/data/${f}`;
const API = f => `https://api.github.com/repos/${OWNER}/${REPO}/contents/data/${f}?ref=data`;

async function getText(f, fresh) {
  // API = topaktuell, aber max. 60 Abrufe/Std. pro Gerät -> nur für live.json; raw = bis zu 5 Min. Cache
  const api = [API(f), { headers: { Accept: "application/vnd.github.raw" }, cache: "no-store" }], raw = [RAW(f) + "?" + Date.now(), {}];
  for (const [url, opt] of fresh ? [api, raw] : [raw, api]) {
    try { const r = await fetch(url, opt); if (r.ok) return await r.text(); } catch (e) { /* nächste Quelle */ }
  }
  return null;
}

async function loadLive() {
  const t = await getText("live.json", true);
  try { const j = JSON.parse(t); const m = j.zeit.match(/T(\d\d:\d\d)/); LIVE = { t: j.zeit, n: j.personen, hhmm: m[1] }; } catch (e) { /* noch keine */ }
}

async function load(full = true) {
  if (full) {
    const [csv, log] = await Promise.all([getText("belegung.csv", false), getText("logbuch.csv", false)]);
    ALL = csv ? parseCSV(csv) : [];
    LOG = parseLog(log); calibrate();
  }
  await loadLive();
  const l = ALL[ALL.length - 1];
  if (l && (!LIVE || new Date(l.t) > new Date(LIVE.t))) LIVE = { t: l.t, n: l.n, hhmm: l.hhmm };
  $("upd").textContent = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  render();
}
load();
setInterval(() => { if (!document.hidden) load(false); }, 2 * 60 * 1000);  // alle 2 Min. neueste Messung
setInterval(() => { if (!document.hidden) load(true); }, 15 * 60 * 1000);  // alle 15 Min. auch den Verlauf
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(true); }); // beim Zurückkehren zur Seite
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 150); });
</script>
