name: Belegung abfragen

on:
  schedule:
    - cron: "*/5 * * * *"    # alle 5 Minuten (GitHub startet manchmal ein paar Minuten später)
  workflow_dispatch:          # Knopf "Run workflow" zum manuellen Testen

permissions:
  contents: write             # darf die Messwerte in den data-Branch schreiben

concurrency:
  group: abfrage
  cancel-in-progress: false

jobs:
  abfrage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Code holen (main)
        uses: actions/checkout@v5

      - name: Messwerte holen (data-Branch)
        id: store
        continue-on-error: true   # beim allerersten Lauf gibt es den Branch noch nicht
        uses: actions/checkout@v5
        with:
          ref: data
          path: store

      - name: data-Branch beim ersten Lauf anlegen
        if: steps.store.outcome != 'success'
        run: |
          rm -rf store && mkdir -p store/data/glyphs
          cp scraper/start-vorlagen/*.png store/data/glyphs/
          printf '# Messdaten\n\nWird automatisch vom Workflow "Belegung abfragen" beschrieben.\n' > store/README.md
          cd store
          git init -q -b data
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Belegung abfragen
        env:
          DATA_DIR: store/data
        run: python scraper/fetch.py

      - name: Speichern (commit in data-Branch)
        working-directory: store
        run: |
          git config user.name  "belegung-bot"
          git config user.email "belegung-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Belegung $(TZ=Europe/Berlin date '+%a %d.%m. %H:%M')"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git pull -q --rebase origin data
          fi
          git push -q origin HEAD:data
